name: Release

# Run manually from the Actions tab. Click "Run workflow" once to build and publish.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write  # Needed to create the tag and release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build JAR
        run: mvn clean package

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ParseOtherK ${{ inputs.tag }}
          body: |
            ParseOther expansion with regex compilation removed from the hot path
            (precompiled patterns + allocation-free char filtering).

            Drop the jar into `plugins/PlaceholderAPI/expansions/` and run `/papi reload`.
          files: target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
